version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stockifyy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockifyy
      POSTGRES_PASSWORD: stockifyy_dev
      POSTGRES_DB: stockifyy_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stockifyy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: stockifyy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/stockifyy-data;
      mc policy set public local/stockifyy-data/public;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

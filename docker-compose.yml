version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stockifyy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockifyy
      POSTGRES_PASSWORD: stockifyy_dev
      POSTGRES_DB: stockifyy_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
